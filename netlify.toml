[build]
  command = "cd artifacts/carelink && corepack enable && pnpm install && pnpm run build"
  publish = "artifacts/carelink/dist"

[functions]
directory = "netlify/functions"
external_node_modules = ["mysql2"]
node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200