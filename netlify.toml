[build]
  command = "cd artifacts/carelink && corepack enable && pnpm install && pnpm run build"
  publish = "artifacts/carelink/dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200